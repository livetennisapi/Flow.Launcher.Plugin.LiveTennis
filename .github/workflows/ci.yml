name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile main.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Truth pin
        run: sh scripts/truthcheck.sh
